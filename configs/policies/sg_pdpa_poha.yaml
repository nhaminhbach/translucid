# Translucid Declarative Compliance Policy Profile
policy_id: sg_pdpa_poha
jurisdiction: Singapore
statutes:
  - Personal Data Protection Act (PDPA)
  - Protection from Harassment Act (POHA - Anti-Doxxing Sections 3 to 7)
  - Defamation Act 1957

positive_redaction_targets:
  visual:
    - whatsapp_telegram_header_name
    - chat_avatar
    - sg_mobile_number_8_digit
    - nric_fin_number
    - paynow_bank_account_number
    - civilian_face
    - vehicle_registration_plate
  text:
    - nric_fin_identifier
    - private_mobile_number
    - individual_residential_unit_number
    - unadjudicated_criminal_fraud_allegation

negative_invariants:
  - dispute_conversation_body
  - itemized_invoice_or_deposit_deduction
  - physical_defect_or_product_damage
  - registered_corporate_entity_name

masking_parameters:
  pixel_rgb: [0, 0, 0]
  padding_px: 5
  additive_residual_pass: true
  max_residual_retries: 1
