[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translucid"
version = "0.1.0"
description = "Zero-Trust Selective Transparency Engine for Whistleblower & Dispute Evidence (Google Cloud AI Builder Cup 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Nhaminhbach Engineering" }
]
keywords = ["privacy", "redaction", "pii", "gemini", "vertex-ai", "compliance", "whistleblower"]
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "boto3>=1.34.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "boto3>=1.34.0",
]

[project.scripts]
translucid-benchmark = "translucid.eval.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
